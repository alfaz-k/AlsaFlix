<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — AlsaFlix</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('alsaflix-theme');
        if (!t) t = 'light'; 
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
  <div class="backdrop"></div>

  <main class="auth-shell">
    <div class="auth-card modern-auth">
      
      <!-- Top Toggle & Close -->
      <div class="modern-auth-header">
        <div class="auth-toggle">
          <a href="signup.html" class="toggle-btn">Sign up</a>
          <a href="index.html" class="toggle-btn active">Sign in</a>
        </div>
        <a href="dashboard.html" class="auth-close" aria-label="Close">&times;</a>
      </div>

      <h2 class="modern-auth-title">Log in to your account</h2>

      <div class="form-banner" id="login-banner"></div>

      <form id="login-form" novalidate>
        
        <!-- Email Field (No label, icon matched to screenshot) -->
        <div class="field modern-field">
          <div class="field-input-wrap icon-left">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 7.00005L10.2 11.65C11.2667 12.45 12.7333 12.45 13.8 11.65L20 7"></path>
              <rect x="3" y="5" width="18" height="14" rx="2"></rect>
            </svg>
            <input type="email" id="login-email" placeholder="Enter your email" autocomplete="email">
          </div>
          <div class="field-error" id="login-email-error"></div>
        </div>

        <!-- Password Field -->
        <div class="field modern-field">
          <div class="field-input-wrap icon-left">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input type="password" id="login-password" placeholder="Enter your password" autocomplete="current-password">
            <button type="button" class="toggle-pass" id="login-toggle-pass">Show</button>
          </div>
          <div class="field-error" id="login-password-error"></div>
          
          <div style="text-align: right; margin-top: 8px;">
            <a href="#" id="login-forgot-pass" class="modern-forgot">Forgot password?</a>
          </div>
        </div>

        <!-- Turnstile CAPTCHA (Centered) -->
        <div style="margin: 20px 0; display: flex; justify-content: center;">
          <div class="cf-turnstile" data-sitekey="0x4AAAAAAD4sAHJB3aWn51TF"></div>
        </div>

        <!-- Primary White Button -->
        <button type="submit" class="btn-white" id="login-submit">
          <span class="spinner"></span>
          <span class="btn-label">Log in</span>
        </button>
      </form>

      <!-- Divider -->
      <div class="modern-divider">OR SIGN IN WITH</div>
      
      <!-- Only Google Button (Full width to match removal of Apple) -->
      <button type="button" id="google-login-btn" class="btn-google-modern">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google logo" width="18" height="18">
        Google
      </button>

      <p class="modern-footer-text">By logging in, you agree to our Terms & Service</p>
    </div>
  </main>

  <script src="theme.js"></script>
  <script type="module" src="firebase.js"></script>
  <script type="module">
    import { initLoginPage } from "./auth.js";
    initLoginPage();
  </script>
</body>
</html>
