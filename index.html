<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — AlsaFlix</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('alsaflix-theme');
        if (!t) t = 'light'; 
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
  <!-- Netflix Multi-Movie Collage Background -->
  <div class="netflix-login-bg"></div>

  <main class="netflix-login-wrapper">
    <div class="netflix-login-card">
      
      <!-- Top Toggle & Close Button -->
      <div class="nl-header">
        <div class="nl-toggle">
          <a href="signup.html" class="nl-pill-btn">Sign up</a>
          <a href="index.html" class="nl-pill-btn active">Sign in</a>
        </div>
        <a href="dashboard.html" class="nl-close" aria-label="Close">&times;</a>
      </div>

      <h2 class="nl-title">Log in to your account</h2>

      <div class="form-banner" id="login-banner"></div>

      <form id="login-form" novalidate>
        
        <!-- Email Field with Icon -->
        <div class="nl-field">
          <svg class="nl-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 7.00005L10.2 11.65C11.2667 12.45 12.7333 12.45 13.8 11.65L20 7"></path>
            <rect x="3" y="5" width="18" height="14" rx="2"></rect>
          </svg>
          <input type="email" id="login-email" placeholder="Enter your email" autocomplete="email">
          <div class="field-error" id="login-email-error"></div>
        </div>

        <!-- Password Field with Icon -->
        <div class="nl-field">
          <svg class="nl-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <input type="password" id="login-password" placeholder="Enter your password" autocomplete="current-password">
          <button type="button" class="nl-toggle-pass" id="login-toggle-pass">Show</button>
          <div class="field-error" id="login-password-error"></div>
        </div>

        <!-- Forgot Password -->
        <a href="#" id="login-forgot-pass" class="nl-forgot">Forgot password?</a>

        <!-- Turnstile CAPTCHA -->
        <div style="margin: 24px 0; display: flex; justify-content: center;">
          <div class="cf-turnstile" data-sitekey="0x4AAAAAAD4sAHJB3aWn51TF"></div>
        </div>

        <!-- Primary White Button -->
        <button type="submit" class="nl-btn-primary" id="login-submit">
          <span class="spinner"></span>
          <span class="btn-label">Log in</span>
        </button>
      </form>

      <!-- Divider -->
      <div class="nl-divider">OR SIGN IN WITH</div>
      
      <!-- Google Button (Matches screenshot dark style) -->
      <button type="button" id="google-login-btn" class="nl-btn-google">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google logo" width="18" height="18">
        Google
      </button>

      <p class="nl-footer-text">By logging in, you agree to our Terms & Service</p>
    </div>
  </main>

  <script src="theme.js"></script>
  <script type="module" src="firebase.js"></script>
  <script type="module">
    import { initLoginPage } from "./auth.js";
    initLoginPage();
  </script>
</body>
</html>
