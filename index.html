<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlsaFlix - Sign In</title>
    
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            color: #fff;
            background-color: #050507;
        }

        /* --- ANIMATED FLUID GLOW BACKGROUND --- */
        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: #050507;
            overflow: hidden;
        }

        .aura {
            position: absolute;
            filter: blur(80px);
            opacity: 0.55;
            mix-blend-mode: screen;
            border-radius: 50%;
            pointer-events: none;
        }

        .aura-1 {
            width: 900px;
            height: 900px;
            top: -200px;
            left: -150px;
            background: radial-gradient(circle, rgba(235, 77, 150, 0.8) 0%, rgba(200, 50, 100, 0) 70%);
            animation: moveAura1 28s ease-in-out infinite alternate;
        }

        .aura-2 {
            width: 800px;
            height: 800px;
            bottom: -200px;
            right: -100px;
            background: radial-gradient(circle, rgba(245, 166, 35, 0.7) 0%, rgba(220, 60, 120, 0) 70%);
            animation: moveAura2 24s ease-in-out infinite alternate;
        }

        .aura-3 {
            width: 700px;
            height: 700px;
            top: 30%;
            left: 40%;
            background: radial-gradient(circle, rgba(90, 80, 240, 0.5) 0%, rgba(0, 200, 255, 0) 70%);
            animation: moveAura3 32s ease-in-out infinite alternate;
        }

        @keyframes moveAura1 {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(180px, 120px) scale(1.15); }
            100% { transform: translate(60px, 240px) scale(0.95); }
        }

        @keyframes moveAura2 {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-140px, -100px) scale(1.2); }
            100% { transform: translate(-220px, 40px) scale(0.9); }
        }

        @keyframes moveAura3 {
            0% { transform: translate(0, 0) scale(0.9); }
            50% { transform: translate(-100px, 80px) scale(1.25); }
            100% { transform: translate(120px, -60px) scale(1.05); }
        }

        /* --- GLASS MODAL --- */
        .modal-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            padding: 24px;
        }

        .auth-modal {
            background-color: rgba(22, 22, 26, 0.68);
            backdrop-filter: blur(35px) saturate(180%);
            -webkit-backdrop-filter: blur(35px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            width: 100%;
            max-width: 440px;
            border-radius: 28px;
            padding: 36px 32px 32px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65), 0 0 1px 1px rgba(255, 255, 255, 0.05);
            position: relative;
        }

        .close-button {
            position: absolute;
            top: 24px;
            right: 24px;
            background-color: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.6);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .close-button:hover {
            color: #fff;
            background-color: rgba(255, 255, 255, 0.12);
        }

        .close-button .material-icons-outlined {
            font-size: 18px;
        }

        /* --- SEGMENTED PILL SWITCHER --- */
        .mode-selector-wrapper {
            display: flex;
            margin-bottom: 24px;
        }

        .mode-selector {
            background-color: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 40px;
            padding: 4px;
            display: inline-flex;
            position: relative;
            width: 190px;
        }

        .mode-button {
            background: none;
            border: none;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.45);
            font-size: 13px;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 40px;
            position: relative;
            z-index: 2;
            flex: 1;
            text-align: center;
            transition: color 0.25s ease;
        }

        .mode-button.active {
            color: #fff;
        }

        .mode-slider {
            position: absolute;
            top: 4px;
            left: 4px;
            height: calc(100% - 8px);
            width: calc(50% - 4px);
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 40px;
            z-index: 1;
            transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sign-in-active .mode-slider {
            transform: translateX(100%);
        }

        /* --- TYPOGRAPHY & FORMS --- */
        .title {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 22px;
            letter-spacing: -0.4px;
            color: rgba(255, 255, 255, 0.95);
        }

        .form-content {
            display: flex;
            flex-direction: column;
            gap: 13px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .combined-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
            background-color: rgba(12, 12, 15, 0.55);
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.2s ease;
        }

        .combined-input-wrapper:focus-within {
            border-color: rgba(255, 255, 255, 0.25);
            background-color: rgba(18, 18, 22, 0.7);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.03);
        }

        .input-icon {
            color: rgba(255, 255, 255, 0.35);
            font-size: 19px;
            margin-left: 14px;
            pointer-events: none;
        }

        .name-input-field {
            width: 100%;
            background: none;
            border: none;
            color: #fff;
            font-size: 14px;
            padding: 14px 16px;
            outline: none;
        }

        .input-field {
            width: 100%;
            background: none;
            border: none;
            color: #fff;
            font-size: 14px;
            padding: 14px 14px 14px 10px;
            outline: none;
        }

        .name-input-field::placeholder,
        .input-field::placeholder,
        .phone-number-field::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }

        /* Phone Input Container */
        .phone-input-wrapper {
            display: flex;
            align-items: center;
            width: 100%;
            background-color: rgba(12, 12, 15, 0.55);
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.2s ease;
            overflow: hidden;
        }

        .phone-input-wrapper:focus-within {
            border-color: rgba(255, 255, 255, 0.25);
            background-color: rgba(18, 18, 22, 0.7);
        }

        .phone-prefix {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 14px 14px;
            border-right: 1px solid rgba(255, 255, 255, 0.06);
            background-color: rgba(0, 0, 0, 0.2);
            user-select: none;
        }

        .flag {
            width: 20px;
            height: auto;
            border-radius: 2px;
        }

        .prefix-arrow {
            color: rgba(255, 255, 255, 0.3);
            font-size: 16px;
        }

        .phone-number-field {
            width: 100%;
            background: none;
            border: none;
            color: #fff;
            font-size: 14px;
            padding: 14px;
            outline: none;
        }

        #errorMessage {
            color: #ff5565;
            font-size: 12px;
            text-align: center;
            display: none;
            margin-top: 2px;
        }

        /* Action Button */
        #submitBtn {
            margin-top: 10px;
            padding: 14px;
            background-color: #ffffff;
            border: none;
            color: #0c0c0e;
            font-size: 15px;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
            transition: transform 0.15s ease, opacity 0.2s ease;
        }

        #submitBtn:hover {
            opacity: 0.95;
        }

        #submitBtn:active {
            transform: scale(0.985);
        }

        #submitBtn[disabled] {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Divider */
        .separator-text {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
            font-weight: 600;
            text-align: center;
            margin: 20px 0 16px;
            position: relative;
            letter-spacing: 0.5px;
        }

        .separator-text::before,
        .separator-text::after {
            content: "";
            position: absolute;
            top: 50%;
            width: calc(50% - 62px);
            height: 1px;
            background-color: rgba(255, 255, 255, 0.08);
        }

        .separator-text::before { left: 0; }
        .separator-text::after { right: 0; }

        /* Social OAuth Buttons */
        .social-buttons {
            display: flex;
            gap: 12px;
        }

        .social-btn {
            flex: 1;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 13px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .social-btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .social-icon {
            height: 18px;
            width: auto;
        }

        /* Footer */
        .terms-text {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.35);
            text-align: center;
            margin-top: 24px;
            line-height: 1.5;
        }

        .terms-text a {
            color: rgba(255, 255, 255, 0.85);
            text-decoration: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .terms-text a:hover {
            border-bottom-color: rgba(255, 255, 255, 0.8);
        }
    </style>
</head>
<body class="sign-in-active" id="bodyWrapper">

    <!-- FLUID ANIMATED BACKGROUND -->
    <div class="background-container">
        <div class="aura aura-1"></div>
        <div class="aura aura-2"></div>
        <div class="aura aura-3"></div>
    </div>

    <!-- GLASS MODAL -->
    <div class="modal-container">
        <div class="auth-modal">
            
            <button class="close-button" id="closeBtn" onclick="history.back()" title="Close">
                <span class="material-icons-outlined">close</span>
            </button>

            <!-- SWITCH TABS -->
            <div class="mode-selector-wrapper">
                <div class="mode-selector">
                    <div class="mode-slider"></div>
                    <button class="mode-button" id="modeSignUpBtn" type="button">Sign up</button>
                    <button class="mode-button active" id="modeSignInBtn" type="button">Sign in</button>
                </div>
            </div>

            <h1 class="title" id="authTitle">Sign in to your account</h1>

            <!-- FORM (Hooked into auth.js) -->
            <form id="authForm" action="#" class="form-content">
                
                <!-- NAME ROW (Shown only in Sign Up mode) -->
                <div class="input-group" id="signUpNamesSection" style="display: none;">
                    <div class="combined-input-wrapper">
                        <input type="text" class="name-input-field" placeholder="First name" id="signUpFirstName">
                    </div>
                    <div class="combined-input-wrapper">
                        <input type="text" class="name-input-field" placeholder="Last name" id="signUpLastName">
                    </div>
                </div>

                <!-- EMAIL -->
                <div class="combined-input-wrapper">
                    <span class="material-icons-outlined input-icon">email</span>
                    <input type="email" class="input-field" placeholder="Enter your email" id="authEmail" required>
                </div>

                <!-- PHONE (Shown only in Sign Up mode) -->
                <div class="phone-input-wrapper" id="phoneSection" style="display: none;">
                    <div class="phone-prefix">
                        <img src="https://upload.wikimedia.org/wikipedia/en/a/a4/Flag_of_the_United_States.svg" alt="US" class="flag">
                        <span class="material-icons-outlined prefix-arrow">expand_more</span>
                    </div>
                    <input type="tel" class="phone-number-field" placeholder="(775) 351-6501" id="authPhone">
                </div>

                <!-- PASSWORD -->
                <div class="combined-input-wrapper">
                    <span class="material-icons-outlined input-icon">lock</span>
                    <input type="password" class="input-field" placeholder="Enter password" id="authPassword" required minlength="6">
                </div>

                <p id="errorMessage"></p>

                <!-- SUBMIT -->
                <button type="submit" id="submitBtn">Sign in</button>

            </form>

            <div class="separator-text">Or sign in with</div>

            <!-- SOCIAL LOGINS -->
            <div class="social-buttons">
                <div class="social-btn" id="googleBtn" role="button" title="Sign in with Google">
                    <img src="https://authjs.dev/img/providers/google.svg" alt="Google" class="social-icon">
                </div>
                <div class="social-btn" id="appleBtn" role="button" title="Sign in with Apple">
                    <img src="https://authjs.dev/img/providers/apple.svg" alt="Apple" class="social-icon">
                </div>
            </div>

            <!-- FOOTER -->
            <p class="terms-text" id="termsFooter" style="display: none;">
                By creating an account, you agree to our 
                <a href="#">Terms</a> & <a href="#">Service</a>
            </p>

        </div>
    </div>

    <!-- UI TAB TOGGLE SCRIPT -->
    <script>
        const body = document.getElementById('bodyWrapper');
        const signUpBtn = document.getElementById('modeSignUpBtn');
        const signInBtn = document.getElementById('modeSignInBtn');
        const title = document.getElementById('authTitle');
        const submitBtn = document.getElementById('submitBtn');
        const termsFooter = document.getElementById('termsFooter');
        const signUpNamesSection = document.getElementById('signUpNamesSection');
        const phoneSection = document.getElementById('phoneSection');

        function setFormMode(mode) {
            if (mode === 'signup') {
                body.classList.remove('sign-in-active');
                body.classList.add('sign-up-active');
                signUpBtn.classList.add('active');
                signInBtn.classList.remove('active');
                
                title.textContent = 'Create an account';
                submitBtn.textContent = 'Create an account';
                signUpNamesSection.style.display = 'flex';
                phoneSection.style.display = 'flex';
                termsFooter.style.display = 'block';
            } else {
                body.classList.remove('sign-up-active');
                body.classList.add('sign-in-active');
                signUpBtn.classList.remove('active');
                signInBtn.classList.add('active');
                
                title.textContent = 'Sign in to your account';
                submitBtn.textContent = 'Sign in';
                signUpNamesSection.style.display = 'none';
                phoneSection.style.display = 'none';
                termsFooter.style.display = 'none';
            }
        }

        signUpBtn.addEventListener('click', () => setFormMode('signup'));
        signInBtn.addEventListener('click', () => setFormMode('signin'));
    </script>

    <!-- FIREBASE & AUTH LOGIC -->
    <script src="firebase.js"></script>
    <script src="auth.js"></script>

</body>
</html>
