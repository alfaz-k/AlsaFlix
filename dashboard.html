<!DOCTYPE html>
<html lang="en">
<head>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — AlsaFlix</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('alsaflix-theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/svg+xml" href="images/favicon.svg"></head>
<body>
  <nav class="navbar">
    <div class="logo">Alsa<span>Flix</span></div>

    <div class="navbar-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="search-input" placeholder="Search movies by title...">
    </div>
    <button type="button" id="suggest-movie-btn" class="btn-suggest">
  🎬 Suggest Movie
</button>

    <div class="navbar-right">
      <button class="btn-logout" id="logout-btn" type="button">Logout</button>
      <button id="theme-toggle">🌙</button>
    </div>
  </nav>

  <main class="dashboard-main">
    <div class="welcome-block">
      <div class="welcome-eyebrow">Dashboard</div>
      <h1 class="welcome-title">Welcome, <span id="welcome-name">...</span></h1>
    </div>

    <p class="results-meta" id="results-meta"></p>

    <div class="movie-grid" id="movie-grid"></div>
  </main>
  <!-- Suggest Movie Modal -->
<div id="suggest-modal" class="modal-overlay">
  <div class="modal-card">
    <button type="button" id="close-modal" class="modal-close">&times;</button>
    <h3 class="modal-title">Suggest a Movie</h3>
    <p class="modal-subtitle">Let us know what movie or series you'd like to watch!</p>
    
    <div id="suggest-banner" class="form-banner"></div>

    <form id="suggest-form">
      <div class="field">
        <label for="suggest-title">Movie / Show Title *</label>
        <div class="field-input-wrap">
          <input type="text" id="suggest-title" placeholder="e.g., Inception, Breaking Bad" required>
        </div>
      </div>

      <div class="field">
        <label for="suggest-email">Your Email (Optional)</label>
        <div class="field-input-wrap">
          <input type="email" id="suggest-email" placeholder="you@example.com">
        </div>
      </div>

      <div class="field">
        <label for="suggest-notes">Additional Notes (Optional)</label>
        <div class="field-input-wrap">
          <textarea id="suggest-notes" placeholder="Release year, language, or specific details..." rows="3" style="width: 100%; background: transparent; border: none; color: #fff; padding: 10px; resize: none; outline: none;"></textarea>
        </div>
      </div>

      <button type="submit" id="suggest-submit" class="btn-primary" style="margin-top: 15px;">
        <span class="btn-label">Send Suggestion</span>
      </button>
    </form>
  </div>
</div>

<!-- Video Player Modal Overlay -->
  <div id="video-modal" class="video-modal" aria-hidden="true">
    <div class="video-modal-backdrop" id="modal-backdrop"></div>
    <div class="video-modal-container">
      <div class="video-modal-header">
        <div class="video-info">
          <span class="badge-live">STREAMING</span>
          <h3 id="modal-movie-title">Movie Title</h3>
        </div>
        <button id="modal-close-btn" class="modal-close-btn" aria-label="Close video player">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="video-player-frame">
        <iframe 
          id="video-iframe" 
          src="" 
          title="AlsaFlix Player" 
          allow="autoplay; encrypted-media; fullscreen" 
          allowfullscreen>
        </iframe>
      </div>
    </div>
  </div>

  <!-- Mobile Desktop View Notice Toast -->
<div id="mobile-notice-toast" class="mobile-notice-toast" role="alert">
  <div class="toast-content">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
      <line x1="8" y1="21" x2="16" y2="21"></line>
      <line x1="12" y1="17" x2="12" y2="21"></line>
    </svg>
    <span>Tip: Enable <strong>Desktop Site</strong> in browser menu for proper full screen playback!</span>
  </div>
  <button id="close-toast-btn" aria-label="Close notice">&times;</button>
</div>


  <footer class="footer">  <a href="https://alfaz81.vercel.app/" target="_blank" rel="noopener noreferrer" class="designer-link">ALFAZ KALADAGI</a> <span>❤️</span></footer>


  <script src="theme.js"></script>
  <script type="module" src="firebase.js"></script>
  <script type="module" src="dashboard.js"></script>
  <script type="module" src="suggest.js"></script>
</body>
</html>
